[package]
name = "ipc-ring"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
resolver = "3"
description = "A zero-copy SPSC IPC magic ring"
license = "MIT OR Apache-2.0"

[target.'cfg(unix)'.dependencies]
shm_open_anonymous = "1.0.2"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "mm", "param", "shm", "thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.186"
rustix = { version = "1.1.4", features = ["fs", "mm", "param", "shm"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
